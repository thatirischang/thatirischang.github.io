#-------------------------------
# Site Settings
title: 張純如工作室
description: 文字是保存靈魂精華的唯一方式。
logo: "/images/logo1.png" # You can add own logo. For example "/images/logo.svg".
logo_dark: "/images/logo1.png"
color_scheme: auto # You can choose three modes auto, light, and dark. By default, the auto mode is set, which means the user can choose the light or dark mode themself.


#-------------------------------
# Navigation Settings
menu_settings:
  menu_items:
    - title: "首頁"
      url: "/"
      key: home
    - title: "視音"
      url: "/videos/"
      key: videos
      # videos 还没有按语言分版本,所有语言都指向 zh 主页面,故不加 lang 前缀
      cross_lang: true
    - title: "張純如工作室"
      url: "/about/"
      key: about






#-------------------------------
# CTA Button (right side of nav)
cta_button:
  enable: true
  cta_button_text: 張純如AI
  cta_button_link: https://ai.irischanglabs.com/


#-------------------------------
# Hero Settings
hero:
  enable: true
  hero_title: 相信一個人的力量
  hero_description: 文字是保存靈魂精華的唯一方式。演講最令我激動之處在於，即使演講者已然作古，長眠地下，他們的精神依然永存。對我來說，這是真正的宗教——永生的最佳方式。


#-------------------------------
# Tags Section Settings
tags_section:
  enable: true
  number_posts: 3 # To control how many posts to show under each tag section, set the value to a number. Three is the default.
  number_columns: 3 # You can specify the number of columns from 1-4 for large screen resolution. By default, the theme uses three columns grid.
  tags:
    - tag: "專訪"
    - tag: "張盈盈專欄"
    - tag: "熱點"
    - tag: "紀念"
    - tag: "超级純如"

# You can add many tag sections to the homepage; each section will show the recent posts by the tag.


