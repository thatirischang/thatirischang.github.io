# --------------------------------------------------------------------------
# 多语言 chrome 字符串字典
#
# 设计原则:
#   - zh(繁中)是 source of truth,所有 fallback 走 zh
#   - en / ja / de / fr 在 Phase 2 voice calibration 通过后才填入文学化译文
#   - 在此之前留空,Liquid 模板用 `default:` filter 自动回退到 zh
#
# Voice 映射:
#   en  -> Iris Chang 本人(《The Rape of Nanking》之笔)
#   ja  -> 大江健三郎(晚年随笔之笔)
#   de  -> Stefan Zweig(《Die Welt von Gestern》之笔)
#   fr  -> Marguerite Yourcenar(《Mémoires d'Hadrien》之笔)
# --------------------------------------------------------------------------

zh:
